<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="FEROX konstrukcije — troškovi, sati i čelične hale, radi i offline" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FEROX" />
    <title>FEROX konstrukcije</title>
    <!-- Odmah skini stari PWA keš na lokalnom preview-u (inače ostaje stara verzija) -->
    <script>
      (function () {
        var h = location.hostname;
        var local =
          h === "localhost" ||
          h === "127.0.0.1" ||
          h === "0.0.0.0" ||
          h.endsWith(".localhost");
        if (!local) return;
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              caches.delete(k);
            });
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
